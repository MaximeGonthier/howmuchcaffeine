<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quickly calculate your caffeine intake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --espresso: #3B2418;
      --cream: #F3E5D0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
      background-color: var(--espresso);
      color: var(--cream);
      font-family: "Fraunces", Georgia, "Times New Roman", serif;
    }

    h1 {
      margin: 0;
      max-width: 20ch;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 600;
      line-height: 1.15;
      text-align: center;
      text-wrap: balance;
    }

    .drinks {
      display: grid;
      grid-template-columns: repeat(3, 12rem);
      gap: 1.5rem;
    }

    .drink {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      aspect-ratio: 1;
      border: none;
      border-radius: 1rem;
      background-color: var(--cream);
      color: var(--espresso);
      font: inherit;
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    @media (hover: hover) {
      .drink:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      }
    }

    .drink:active {
      transform: scale(0.95);
      box-shadow: none;
    }

    .drink:focus-visible {
      outline: 3px solid var(--cream);
      outline-offset: 4px;
    }

    .drink-icon {
      font-size: 3.5rem;
      line-height: 1;
    }

    @media (max-width: 600px) {
      .drinks {
        grid-template-columns: 1fr;
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .drink {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <h1>Quickly calculate your caffeine intake</h1>

  <div class="drinks">
    <button type="button" class="drink">
      <span class="drink-icon" aria-hidden="true">☕</span>
      Espresso
    </button>
    <button type="button" class="drink">
      <span class="drink-icon" aria-hidden="true">☕</span>
      Cappuccino
    </button>
    <button type="button" class="drink">
      <span class="drink-icon" aria-hidden="true">☕</span>
      Americano
    </button>
  </div>
</body>
</html>
