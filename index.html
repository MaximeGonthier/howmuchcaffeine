<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quickly calculate your caffeine intake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --espresso: #3B2418;
      --roast: #5C3A27;
      --cream: #F3E5D0;
      --milk: #FBF4EA;
      --caramel: #A8551E;
      --muted: #76563F;
      --grid: #E0CBAE;
      --deep-blue: #1E3A8A;
      --crimson: #9F1239;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
      background-color: var(--espresso);
      color: var(--cream);
      font-family: "Fraunces", Georgia, "Times New Roman", serif;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    h1 {
      margin: 0;
      max-width: 20ch;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 600;
      line-height: 1.15;
      text-align: center;
      text-wrap: balance;
    }

    .total {
      margin: 0;
      font-size: 1.5rem;
    }

    .drinks {
      display: grid;
      grid-template-columns: repeat(3, 12rem);
      gap: 1.5rem;
    }

    .drink {
      aspect-ratio: 1;
      border-radius: 1rem;
      background-color: var(--cream);
      color: var(--espresso);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    @media (hover: hover) {
      .drink[data-state="idle"]:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      }
    }

    .drink:has(.drink-face:active) {
      transform: scale(0.95);
      box-shadow: none;
    }

    /* Each card shows one panel at a time, picked by its data-state. */
    .drink-face,
    .drink-when,
    .drink-hour {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      height: 100%;
      margin: 0;
    }

    .drink[data-state="idle"] .drink-face,
    .drink[data-state="when"] .drink-when,
    .drink[data-state="hour"] .drink-hour {
      display: flex;
    }

    .drink-face {
      align-items: center;
      border: none;
      border-radius: inherit;
      background: none;
      color: inherit;
      font: inherit;
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
    }

    .drink-face:focus-visible {
      outline: 3px solid var(--cream);
      outline-offset: 4px;
    }

    .drink-icon {
      font-size: 3.5rem;
      line-height: 1;
    }

    .drink-when,
    .drink-hour {
      padding: 1.25rem;
    }

    .drink-when .choice {
      flex: 1;
    }

    .choice {
      padding: 0.75rem;
      border: none;
      border-radius: 0.6rem;
      background-color: var(--espresso);
      color: var(--cream);
      font: inherit;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    @media (hover: hover) {
      .choice:hover {
        background-color: var(--roast);
      }
    }

    .choice:active {
      transform: scale(0.96);
    }

    .choice:focus-visible,
    .hour-select:focus-visible {
      outline: 3px solid var(--roast);
      outline-offset: 2px;
    }

    .hour-label {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .hour-select {
      padding: 0.5rem;
      border: 2px solid var(--espresso);
      border-radius: 0.6rem;
      background-color: var(--milk);
      color: var(--espresso);
      font: inherit;
    }

    .chart-card {
      width: min(100%, 39rem);
      padding: 1.25rem;
      border-radius: 1rem;
      background-color: var(--cream);
      color: var(--espresso);
    }

    .chart-card h2 {
      margin: 0 0 1rem;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .chart-frame {
      position: relative;
    }

    .chart {
      display: block;
      width: 100%;
      overflow: visible;
      touch-action: pan-y;
    }

    .chart:focus-visible {
      outline: 3px solid var(--caramel);
      outline-offset: 4px;
    }

    .chart text {
      fill: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .grid-line {
      stroke: var(--grid);
      stroke-width: 1;
    }

    .area {
      fill: var(--caramel);
      opacity: 0.1;
    }

    .curve {
      fill: none;
      stroke: var(--caramel);
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .limit-line {
      stroke-width: 2;
      stroke-dasharray: 6 4;
    }

    .limit-line.safe {
      stroke: var(--deep-blue);
    }

    .limit-line.harmful {
      stroke: var(--crimson);
    }

    /* The cream outline keeps the labels readable where the curve crosses them. */
    .chart .limit-label {
      fill: var(--espresso);
      font-weight: 600;
      stroke: var(--cream);
      stroke-width: 4px;
      stroke-linejoin: round;
      paint-order: stroke;
    }

    .intake-tick {
      stroke: var(--caramel);
      stroke-width: 2;
    }

    .intake-dot,
    .crosshair circle {
      fill: var(--caramel);
      stroke: var(--cream);
      stroke-width: 2;
    }

    .now-line {
      stroke: var(--muted);
      stroke-width: 1;
    }

    .crosshair line {
      stroke: var(--espresso);
      stroke-width: 1;
    }

    .tooltip {
      position: absolute;
      padding: 0.4rem 0.6rem;
      border-radius: 0.5rem;
      background-color: var(--espresso);
      color: var(--cream);
      font-size: 0.9rem;
      white-space: nowrap;
      pointer-events: none;
    }

    .tooltip strong {
      display: block;
      font-size: 1.05rem;
    }

    .study {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--grid);
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .study p {
      margin: 0 0 0.75rem;
    }

    .study blockquote {
      margin: 0 0 0.75rem;
      padding-left: 0.75rem;
      border-left: 3px solid var(--deep-blue);
      color: var(--espresso);
    }

    .study .reference {
      margin-bottom: 0;
      font-size: 0.8rem;
    }

    .study a {
      color: var(--deep-blue);
      overflow-wrap: anywhere;
    }

    .visitors {
      color: var(--cream);
      font-size: 0.9rem;
      opacity: 0.75;
    }

    @media (max-width: 600px) {
      .drinks {
        grid-template-columns: 1fr;
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .drink,
      .choice {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Quickly calculate your caffeine intake</h1>
    <p class="total" aria-live="polite">Caffeine intake: <span id="total">0</span> mg</p>
  </header>

  <div class="drinks">
    <div class="drink" data-drink="espresso" data-state="idle">
      <button type="button" class="drink-face">
        <span class="drink-icon" aria-hidden="true">☕</span>
        Espresso
      </button>
    </div>
    <div class="drink" data-drink="cappuccino" data-state="idle">
      <button type="button" class="drink-face">
        <span class="drink-icon" aria-hidden="true">☕</span>
        Cappuccino
      </button>
    </div>
    <div class="drink" data-drink="americano" data-state="idle">
      <button type="button" class="drink-face">
        <span class="drink-icon" aria-hidden="true">☕</span>
        Americano
      </button>
    </div>
    <div class="drink" data-drink="matcha" data-state="idle">
      <button type="button" class="drink-face">
        <span class="drink-icon" aria-hidden="true">🍵</span>
        Matcha
      </button>
    </div>
    <div class="drink" data-drink="tea" data-state="idle">
      <button type="button" class="drink-face">
        <span class="drink-icon" aria-hidden="true">🫖</span>
        Tea
      </button>
    </div>
    <div class="drink" data-drink="energy_drink" data-state="idle">
      <button type="button" class="drink-face">
        <span class="drink-icon" aria-hidden="true">⚡</span>
        Energy drink
      </button>
    </div>
  </div>

  <section class="chart-card">
    <h2>Caffeine in your body</h2>
    <div class="chart-frame">
      <svg class="chart" id="chart" tabindex="0" role="img"></svg>
      <div class="tooltip" id="tooltip" hidden></div>
    </div>
    <div class="study">
      <p>The sleep lines are based on the study cited below, which concludes:</p>
      <blockquote id="study-conclusion"></blockquote>
      <p id="limit-note"></p>
      <p class="reference"><span id="study-citation"></span><a id="study-link"></a></p>
    </div>
  </section>

  <footer class="visitors" id="visitors" hidden></footer>

  <template id="drink-panels">
    <div class="drink-when">
      <button type="button" class="choice when-now">Now</button>
      <button type="button" class="choice when-earlier">Earlier</button>
    </div>
    <form class="drink-hour">
      <label class="hour-label">
        What time?
        <select class="hour-select" name="hour"></select>
      </label>
      <button type="submit" class="choice">Add</button>
    </form>
  </template>

  <script type="module">
    import { caffeineInBody } from "./formulas.js";

    const [caffeine, sleep] = await Promise.all(
      ["caffeine.json", "sleep.json"].map((file) => fetch(file).then((response) => response.json()))
    );

    // Bedtime levels for the study's safe and harmful cases, inferred with our formulas.
    const safeLevel = caffeineInBody(sleep.safe.dose_mg, sleep.safe.hours_before_bed);
    const harmfulLevel = caffeineInBody(sleep.unsafe.dose_mg, sleep.unsafe.hours_before_bed);

    const studyLink = document.getElementById("study-link");
    document.getElementById("study-conclusion").textContent = `“${sleep.study.conclusion}”`;
    document.getElementById("study-citation").textContent = `${sleep.study.citation}, `;
    studyLink.href = sleep.study.doi_url;
    studyLink.textContent = sleep.study.doi_url;
    document.getElementById("limit-note").textContent =
      "Thus, the two lines drawn on the chart are not clearly measured thresholds: they are inferred from our " +
      `caffeine absorption and decay formulas. ${sleep.safe.dose_mg} mg taken ${sleep.safe.hours_before_bed} hours ` +
      `before bed leaves about ${Math.round(safeLevel)} mg in the body at bedtime, which the study found safe ` +
      `(blue line), while ${sleep.unsafe.dose_mg} mg taken ${sleep.unsafe.hours_before_bed} hours before bed ` +
      `leaves about ${Math.round(harmfulLevel)} mg, which may impact sleep (red line).`;

    const totalOutput = document.getElementById("total");
    const panels = document.getElementById("drink-panels");
    const cards = document.querySelectorAll(".drink");
    const chart = document.getElementById("chart");
    const tooltip = document.getElementById("tooltip");

    // Each entry is { drink, time, mg }, with time in hours since midnight.
    const intake = [];

    const focusTarget = { idle: ".drink-face", when: ".when-now", hour: ".hour-select" };

    function setState(card, state) {
      card.dataset.state = state;
      card.querySelector(focusTarget[state]).focus();
    }

    function closeAll(except) {
      for (const card of cards) {
        if (card !== except) card.dataset.state = "idle";
      }
    }

    function hoursNow() {
      const now = new Date();
      return now.getHours() + now.getMinutes() / 60;
    }

    function formatTime(hours) {
      const minutes = Math.round(hours * 60);
      const pad = (value) => String(value).padStart(2, "0");
      return `${pad(Math.floor(minutes / 60))}:${pad(minutes % 60)}`;
    }

    function addDrink(card, time) {
      const drink = card.dataset.drink;
      intake.push({ drink, time, mg: caffeine[drink].caffeine_mg });
      totalOutput.textContent = intake.reduce((sum, entry) => sum + entry.mg, 0);
      setState(card, "idle");
      render();
    }

    // Only hours from midnight up to the current hour count as "earlier".
    function fillHours(select) {
      const currentHour = new Date().getHours();
      select.replaceChildren();
      for (let hour = 0; hour <= currentHour; hour++) {
        select.add(new Option(formatTime(hour), hour));
      }
      select.value = Math.max(currentHour - 1, 0);
    }

    for (const card of cards) {
      card.append(panels.content.cloneNode(true));

      card.querySelector(".drink-face").addEventListener("click", () => {
        closeAll(card);
        setState(card, "when");
      });

      card.querySelector(".when-now").addEventListener("click", () => {
        addDrink(card, hoursNow());
      });

      card.querySelector(".when-earlier").addEventListener("click", () => {
        fillHours(card.querySelector(".hour-select"));
        setState(card, "hour");
      });

      card.querySelector(".drink-hour").addEventListener("submit", (event) => {
        event.preventDefault();
        addDrink(card, Number(card.querySelector(".hour-select").value));
      });
    }

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      const open = document.querySelector('.drink:not([data-state="idle"])');
      if (open) setState(open, "idle");
    });

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".drink")) closeAll();
    });

    // ---- Plot of caffeine in the body ----

    const SVG_NS = "http://www.w3.org/2000/svg";
    const CHART_HEIGHT = 240;
    const MARGIN = { top: 18, right: 12, bottom: 28, left: 40 };
    const SAMPLES_PER_HOUR = 4;

    let scale = null;
    let crosshair = null;
    let cursorTime = null;

    function levelAt(time) {
      return intake
        .filter((entry) => entry.time <= time)
        .reduce((sum, entry) => sum + caffeineInBody(entry.mg, time - entry.time), 0);
    }

    // One sample every 15 minutes, plus one at each drink so its dot sits on the line.
    function curvePoints() {
      const times = new Set(intake.map((entry) => entry.time));
      for (let i = 0; i <= 24 * SAMPLES_PER_HOUR; i++) times.add(i / SAMPLES_PER_HOUR);
      return [...times].sort((a, b) => a - b).map((time) => [time, levelAt(time)]);
    }

    function niceStep(raw) {
      const power = 10 ** Math.floor(Math.log10(raw));
      const fraction = raw / power;
      return (fraction <= 1 ? 1 : fraction <= 2 ? 2 : fraction <= 5 ? 5 : 10) * power;
    }

    function draw(name, attributes, parent = chart) {
      const element = document.createElementNS(SVG_NS, name);
      for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
      parent.append(element);
      return element;
    }

    function render() {
      const width = chart.parentElement.clientWidth;
      const height = CHART_HEIGHT;
      chart.setAttribute("viewBox", `0 0 ${width} ${height}`);
      chart.setAttribute("height", height);
      chart.replaceChildren();

      const points = curvePoints();
      const highest = Math.max(...points.map(([, level]) => level));
      const top = Math.max(highest, harmfulLevel * 1.25);
      const step = niceStep(top / 4);
      const yMax = Math.ceil(top / step) * step;

      const plotWidth = width - MARGIN.left - MARGIN.right;
      const plotHeight = height - MARGIN.top - MARGIN.bottom;
      const x = (time) => MARGIN.left + (time / 24) * plotWidth;
      const y = (mg) => MARGIN.top + plotHeight - (mg / yMax) * plotHeight;
      scale = { x, y, width, plotWidth };

      for (let mg = 0; mg <= yMax; mg += step) {
        draw("line", { class: "grid-line", x1: MARGIN.left, x2: width - MARGIN.right, y1: y(mg), y2: y(mg) });
        draw("text", { x: MARGIN.left - 8, y: y(mg), "text-anchor": "end", "dominant-baseline": "middle" })
          .textContent = mg;
      }

      const hourStep = plotWidth < 400 ? 6 : 3;
      for (let hour = 0; hour <= 24; hour += hourStep) {
        draw("line", { class: "grid-line", x1: x(hour), x2: x(hour), y1: y(0), y2: y(0) + 4 });
        draw("text", { x: x(hour), y: height - 6, "text-anchor": "middle" }).textContent = formatTime(hour);
      }

      const now = hoursNow();
      draw("line", { class: "now-line", x1: x(now), x2: x(now), y1: MARGIN.top, y2: y(0) });
      draw("text", { x: x(now), y: MARGIN.top - 6, "text-anchor": "middle" }).textContent = "Now";

      const line = points.map(([time, level], i) => `${i ? "L" : "M"}${x(time).toFixed(1)},${y(level).toFixed(1)}`).join("");
      // The safe label sits under its line and the harmful one above, so they never collide.
      const limits = [
        { kind: "safe", level: safeLevel, label: "Tested safe for sleep", labelOffset: 16 },
        { kind: "harmful", level: harmfulLevel, label: "Tested harmful to sleep", labelOffset: -6 },
      ];

      draw("path", { class: "area", d: `${line}L${x(24)},${y(0)}L${x(0)},${y(0)}Z` });
      for (const limit of limits) {
        const limitY = y(limit.level);
        draw("line", { class: `limit-line ${limit.kind}`, x1: MARGIN.left, x2: width - MARGIN.right, y1: limitY, y2: limitY });
      }
      draw("path", { class: "curve", d: line });
      for (const limit of limits) {
        draw("text", { class: "limit-label", x: MARGIN.left + 6, y: y(limit.level) + limit.labelOffset })
          .textContent = `${limit.label}: ${Math.round(limit.level)} mg`;
      }

      for (const entry of intake) {
        draw("line", { class: "intake-tick", x1: x(entry.time), x2: x(entry.time), y1: y(0), y2: y(0) + 6 });
        draw("circle", { class: "intake-dot", cx: x(entry.time), cy: y(levelAt(entry.time)), r: 5 });
      }

      crosshair = draw("g", { class: "crosshair", visibility: "hidden" });
      draw("line", { y1: MARGIN.top, y2: y(0) }, crosshair);
      draw("circle", { r: 5 }, crosshair);

      const limitsText = limits.map((limit) => `${limit.label}: ${Math.round(limit.level)} mg.`).join(" ");
      chart.setAttribute("aria-label", intake.length
        ? `Caffeine in your body over the day, peaking at ${Math.round(highest)} mg. ${limitsText}`
        : `Caffeine in your body over the day. No drinks added yet. ${limitsText}`);

      if (!tooltip.hidden) showCrosshair(cursorTime);
    }

    // Snaps to the nearest 15 minutes.
    function snapTime(time) {
      return Math.min(24, Math.max(0, Math.round(time * SAMPLES_PER_HOUR) / SAMPLES_PER_HOUR));
    }

    function showCrosshair(time) {
      cursorTime = time;
      const level = levelAt(time);
      const cx = scale.x(time);

      crosshair.setAttribute("visibility", "visible");
      crosshair.querySelector("line").setAttribute("x1", cx);
      crosshair.querySelector("line").setAttribute("x2", cx);
      crosshair.querySelector("circle").setAttribute("cx", cx);
      crosshair.querySelector("circle").setAttribute("cy", scale.y(level));

      const value = document.createElement("strong");
      value.textContent = `${Math.round(level)} mg`;
      tooltip.replaceChildren(value, `at ${formatTime(time)}`);
      tooltip.hidden = false;

      const flip = cx + 12 + tooltip.offsetWidth > scale.width;
      tooltip.style.left = `${flip ? cx - 12 - tooltip.offsetWidth : cx + 12}px`;
      tooltip.style.top = `${MARGIN.top}px`;
    }

    function hideCrosshair() {
      crosshair.setAttribute("visibility", "hidden");
      tooltip.hidden = true;
    }

    chart.addEventListener("pointermove", (event) => {
      const box = chart.getBoundingClientRect();
      showCrosshair(snapTime(((event.clientX - box.left - MARGIN.left) / scale.plotWidth) * 24));
    });
    chart.addEventListener("pointerleave", hideCrosshair);

    chart.addEventListener("focus", () => showCrosshair(cursorTime ?? snapTime(hoursNow())));
    chart.addEventListener("blur", hideCrosshair);
    chart.addEventListener("keydown", (event) => {
      const delta = { ArrowLeft: -1, ArrowRight: 1 }[event.key] / SAMPLES_PER_HOUR;
      if (!delta) return;
      event.preventDefault();
      showCrosshair(Math.min(24, Math.max(0, cursorTime + delta)));
    });

    new ResizeObserver(render).observe(chart.parentElement);
    setInterval(render, 60_000);
  </script>

  <script type="module">
    // Visitor total from GoatCounter, read from the same site the counting script below reports to.
    // The line stays hidden if GoatCounter is blocked or unreachable.
    const endpoint = document.querySelector("script[data-goatcounter]").dataset.goatcounter;
    try {
      const response = await fetch(new URL("/counter/TOTAL.json", endpoint));
      if (response.ok) {
        const { count } = await response.json();
        const footer = document.getElementById("visitors");
        footer.textContent = `${count} ${count === "1" ? "visitor" : "visitors"}`;
        footer.hidden = false;
      }
    } catch {
      // Blocked or offline: keep the line hidden.
    }
  </script>

  <script data-goatcounter="https://maximegonthier.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
